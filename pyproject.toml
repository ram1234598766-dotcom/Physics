[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "structure-flow-calculus"
version = "0.1.0"
description = "Structure-Flow Calculus: a complete calculus, spectral theory, and physical theory built on a single positive function rho(x)."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Mrityunjay K", email = "ram1234598766-dotcom@users.noreply.github.com"},
]
keywords = ["mathematics", "physics", "spectral-theory", "calculus", "numerical-methods"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
    "black>=23.0",
]

[project.urls]
Homepage = "https://github.com/ram1234598766-dotcom/Physics"
Documentation = "https://physics.ram1234598766-dotcom.workers.dev"

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 88
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["demos"]
python_files = ["*.py"]
python_functions = ["test_*", "verify_*"]
addopts = "-v --tb=short --disable-warnings"

[tool.coverage.run]
source = ["demos"]
omit = ["*/test*"]
